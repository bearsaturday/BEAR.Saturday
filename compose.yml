services:
  php84:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: '8.4'
    volumes:
      - .:/app
    command: sh -lc 'composer install --no-interaction --no-progress && composer ci'

  php85:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: '8.5'
    volumes:
      - .:/app
    command: sh -lc 'composer install --no-interaction --no-progress && composer ci'
